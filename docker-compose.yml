# docker compose up --build   ->  web http://localhost:5173, api http://localhost:8000
# Settings come from the shell or from a .env file next to this file (see env.example).
# Every variable in env.example is listed under api.environment as ${NAME:-}: an unset one
# arrives empty and keeps its default from backend/app/config.py. The explicit form works in
# both Docker Compose and podman-compose (backend/tests/test_config.py checks the list).
# LLM_PROVIDER=ollama (default) talks to the `ollama` service via LLM_OLLAMA_URL; edenai to Eden AI.
# Download the local model once: scripts/pull_model.sh
# Stała nazwa projektu: wolumen z modelem jest ten sam w każdym katalogu (klon, worktree).
name: hacknation-2026
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    # Treść pkt 5: bez trwałego zapisu i bez uprawnień roota. Zapis tylko do /tmp w pamięci.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-}
      JWT_ENABLED: ${JWT_ENABLED:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-}
      # D9 (M1.7): `ollama` (domyślnie) albo `edenai`. Eden AI wymaga wyjścia do internetu.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      # Pusty adres daje adres dostawcy: Ollama z compose poniżej albo Eden AI.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # Adres Ollamy osobno, żeby przy `edenai` nie trafił do LLM_BASE_URL.
      LLM_OLLAMA_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-}
      LLM_CONNECT_TIMEOUT_S: ${LLM_CONNECT_TIMEOUT_S:-}
      LLM_ANALYSIS_BUDGET_S: ${LLM_ANALYSIS_BUDGET_S:-}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_STRICT_SCHEMA: ${LLM_STRICT_SCHEMA:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_FIXTURE: ${LLM_FIXTURE:-}
      OCR_LANG: ${OCR_LANG:-}
      ADD_VALIDATORS: ${ADD_VALIDATORS:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  # Model lokalny (SPEC „Model”). Bez portu na hoście: woła go tylko `api` w sieci compose.
  ollama:
    build: ./ollama
    volumes:
      - ollama-models:/home/ollama/.ollama
    environment:
      # K1: /v1 nie ustawia num_ctx, a domyślne 4096 tokenów nie mieści promptu z odpowiedzią.
      # Ta sama zmienna co budżet analizy w `api`: serwer z mniejszym kontekstem przycina prompt po cichu.
      OLLAMA_CONTEXT_LENGTH: ${LLM_CONTEXT_TOKENS:-32768}
      # Model zostaje w pamięci, więc demo nie czeka na ponowne ładowanie.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      # Serwis Ollamy działa lokalnie, bez modeli i usług w chmurze Ollamy.
      OLLAMA_NO_CLOUD: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ollama-models:
