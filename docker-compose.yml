# docker compose up --build   ->  web http://localhost:5173, api http://localhost:8000
# Settings come from the shell or from a .env file next to this file (see env.example).
# Every variable in env.example is listed under api.environment as ${NAME:-}: an unset one
# arrives empty and keeps its default from backend/app/config.py. The explicit form works in
# both Docker Compose and podman-compose (backend/tests/test_config.py checks the list).
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-}
      JWT_ENABLED: ${JWT_ENABLED:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-}
      LLM_FIXTURE: ${LLM_FIXTURE:-}
      OCR_LANG: ${OCR_LANG:-}
      ADD_VALIDATORS: ${ADD_VALIDATORS:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
